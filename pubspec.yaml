name: medicine_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png" 
  min_sdk_android: 21

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.4.2
  responsive_sizer: ^3.3.1
  google_fonts: ^6.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  circle_nav_bar: ^2.2.0
  flutter_localizations:
    sdk: flutter
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.5.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon/